<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escena 3D - prueba</title>
    <style>
      /* El canvas de Three.js debe ocupar toda la pantalla, sin scroll ni márgenes. */
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 1.5rem;
        background: rgba(0, 0, 0, 0.5);
        cursor: pointer;
      }
      #overlay[hidden] {
        display: none;
      }

      #prompt-interaccion {
        position: fixed;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-family: system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.6);
        padding: 0.5rem 1rem;
        border-radius: 6px;
      }
      #prompt-interaccion[hidden] {
        display: none;
      }

      #panel-info {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.75);
      }
      #panel-info[hidden] {
        display: none;
      }
      #panel-info .caja {
        background: #1e1e1e;
        color: #eee;
        font-family: system-ui, sans-serif;
        max-width: 500px;
        width: 90%;
        padding: 1.5rem;
        border-radius: 8px;
      }
      #panel-contenido {
        margin-top: 1rem;
        padding-left: 1.2rem;
      }
      #panel-contenido li {
        margin-bottom: 0.5rem;
      }
    </style>

    <!-- Import map: le dice al navegador que cuando el JS haga
         import ... from "three", lo busque en esta URL de CDN.
         Sin esto, "three" no significaría nada para el navegador. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.186.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="overlay">Click para explorar (WASD + mouse, Esc para salir)</div>

    <div id="prompt-interaccion" hidden>Presioná E para ver los proyectos</div>

    <div id="panel-info" hidden>
      <div class="caja">
        <h2>Proyectos</h2>
        <ul id="panel-contenido"></ul>
        <p><small>Presioná E para cerrar</small></p>
      </div>
    </div>

    <script type="module" src="js/scene.js"></script>
  </body>
</html>
